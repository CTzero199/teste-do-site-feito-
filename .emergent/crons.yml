crons:
  - name: appt-reminders
    description: "Envia lembrete de WhatsApp ~1h antes de cada agendamento confirmado"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    enabled: true
  - name: subscription-renewal-reminders
    description: "Avisa no WhatsApp ~3 dias antes da renovação mensal de cada assinatura ativa"
    cron: "0 12 * * *"
    endpoint: "{{BASE_URL}}/api/cron/subscription-reminders"
    method: POST
    enabled: true
